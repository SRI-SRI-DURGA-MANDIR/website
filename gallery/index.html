<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>গ্যালারি | শ্রী শ্রী দুর্গা মন্দির</title>

<meta name="description" content="শ্রী শ্রী দুর্গা মন্দিরের ছবির গ্যালারি।">
<meta name="theme-color" content="#2b0808">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Noto Sans Bengali", Arial, sans-serif;
    background: #2b0808;
    color: #fff;
    text-align: center;
}

header {
    padding: 30px 15px 20px;
    background: linear-gradient(135deg, #4a0c0c, #210505);
    border-bottom: 2px solid #d4af37;
}

header h1 {
    color: #ffd700;
    font-size: 30px;
    margin-bottom: 10px;
}

header p {
    color: #f5deb3;
    font-size: 16px;
    line-height: 1.8;
}

nav {
    background: #3b0909;
    padding: 13px 8px;
    border-bottom: 1px solid #8b6b20;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    position: RIGHT;
    top: 0;
    z-index: 100;
}

nav a {
    color: #ffd700;
    text-decoration: none;
    font-size: 15px;
    transition: 0.3s;
}

nav a:hover {
    color: #fff;
}

.gallery-container {
    width: 94%;
    max-width: 1250px;
    margin: 30px auto;
    padding: 15px 0 35px;
}

.gallery-title {
    color: #ffd700;
    font-size: 28px;
    margin-bottom: 25px;
}

.slider {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    overflow: hidden;
    background: #000;
    border: 2px solid #c9a227;
    border-radius: 8px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.45);
}

.slider-track {
    display: flex;
    transition: transform 0.7s ease-in-out;
}

.gallery-item {
    min-width: 100%;
    flex: 0 0 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
    padding: 15px;
}

.gallery-item img {
    width: 100%;
    height: 550px;
    object-fit: contain;
    display: block;
    cursor: pointer;
    background: #000;
    border-radius: 5px;
}

.slider-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 20px;
}

.slider-controls button {
    background: #d4af37;
    color: #2b0808;
    border: none;
    padding: 10px 22px;
    border-radius: 5px;
    font-size: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.slider-controls button:hover {
    background: #fff;
    transform: scale(1.05);
}

.dots {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #9b7777;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

.dot.active {
    background: #ffd700;
    transform: scale(1.2);
}

.lightbox {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border: 2px solid #d4af37;
    border-radius: 8px;
}

.lightbox-close {
    position: absolute;
    top: 15px;
    right: 25px;
    color: #fff;
    font-size: 40px;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 10000;
}

footer {
    background: #1b0404;
    color: #f5deb3;
    padding: 22px 10px;
    margin-top: 25px;
    border-top: 1px solid #c9a227;
    font-size: 14px;
    line-height: 2;
}

@media (max-width: 850px) {
    .gallery-container {
        width: 96%;
    }

    .gallery-item img {
        height: 450px;
    }
}

@media (max-width: 550px) {
    header h1 {
        font-size: 25px;
    }

    header p {
        font-size: 14px;
    }

    nav {
        gap: 12px;
        padding: 12px 6px;
    }

    nav a {
        font-size: 13px;
    }

    .gallery-container {
        width: 96%;
        margin: 20px auto;
    }

    .gallery-title {
        font-size: 23px;
    }

    .gallery-item {
        padding: 8px;
    }

    .gallery-item img {
        height: 350px;
        max-width: 100%;
    }

    .slider-controls {
        gap: 18px;
    }

    .slider-controls button {
        padding: 9px 17px;
    }

    .lightbox {
        padding: 10px;
    }

    .lightbox img {
        max-width: 96vw;
        max-height: 85vh;
    }

    .lightbox-close {
        top: 8px;
        right: 15px;
        font-size: 35px;
    }
}
</style>
</head>

<body>

<header>
    <h1>গ্যালারি</h1>
    <p>পবিত্র মুহূর্তগুলির কিছু স্মৃতি।</p>
    <p>🙏 জয় মা দুর্গা 🙏</p>
</header>

<nav>
    <a href="/website/">HOME</a>
    <a href="/website/mantra/">MANTRA</a>
    <a href="/website/gallery/">গGALLERY</a>
    <a href="/website/about/">ABOUT</a>
    <a href="/website/video/">VIDEO</a>
    <a href="/website/tribute/">TRIBUTE</a>
    <a href="/website/contact/">CONTACT</a>
</nav>

<main class="gallery-container">

    <h2 class="gallery-title">ছবিতে ক্লিক করুন</h2>

    <div class="slider">
        <div class="slider-track" id="sliderTrack">

            <div class="gallery-item"><img src="../images/a.jpg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/b.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/c.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/d.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/e.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/f.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/g.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/h.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/i.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/j.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/k.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/l.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/m.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/n.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>
            <div class="gallery-item"><img src="../images/o.jpeg" alt="মন্দিরের ছবি" onclick="openLightbox(this)"></div>

        </div>
    </div>

    <div class="slider-controls">
        <button onclick="moveSlide(-1)" aria-label="আগের ছবি">❮</button>
        <button onclick="moveSlide(1)" aria-label="পরের ছবি">❯</button>
    </div>

    <div class="dots" id="dots"></div>

</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">

    <button class="lightbox-close"
            onclick="closeLightbox(event)"
            aria-label="বন্ধ করুন">×</button>

    <img id="lightboxImage" src="" alt="বড় ছবি">

</div>

<footer>
    <p>© ২০২৬ শ্রী শ্রী দুর্গা মন্দির</p>
    <p>🙏 জয় মা দুর্গা | জয় মাতাদি 🙏</p>
</footer>

<script>
const track = document.getElementById("sliderTrack");
const slides = document.querySelectorAll(".gallery-item");
const dotsContainer = document.getElementById("dots");
const lightbox = document.getElementById("lightbox");

let currentSlide = 0;
let autoSlide;

slides.forEach((slide, index) => {
    const dot = document.createElement("button");

    dot.className = "dot";
    dot.setAttribute("aria-label", "ছবি " + (index + 1));

    dot.addEventListener("click", () => {
        showSlide(index);
        restartAutoSlide();
    });

    dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

function showSlide(index) {
    currentSlide = (index + slides.length) % slides.length;

    track.style.transform =
        "translateX(-" + (currentSlide * 100) + "%)";

    dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === currentSlide);
    });
}

function moveSlide(direction) {
    showSlide(currentSlide + direction);
    restartAutoSlide();
}

function startAutoSlide() {
    clearInterval(autoSlide);

    autoSlide = setInterval(() => {
        if (!lightbox.classList.contains("active")) {
            showSlide(currentSlide + 1);
        }
    }, 4000);
}

function restartAutoSlide() {
    startAutoSlide();
}

function openLightbox(image) {
    const lightboxImage = document.getElementById("lightboxImage");

    lightboxImage.src = image.src;
    lightboxImage.alt = image.alt;

    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";

    clearInterval(autoSlide);
}

function closeLightbox(event) {
    if (
        event.target.id === "lightbox" ||
        event.target.classList.contains("lightbox-close")
    ) {
        lightbox.classList.remove("active");
        document.getElementById("lightboxImage").src = "";
        document.body.style.overflow = "";
        startAutoSlide();
    }
}

document.addEventListener("keydown", function(event) {
    if (
        event.key === "Escape" &&
        lightbox.classList.contains("active")
    ) {
        lightbox.classList.remove("active");
        document.getElementById("lightboxImage").src = "";
        document.body.style.overflow = "";
        startAutoSlide();
    }
});

const slider = document.querySelector(".slider");

slider.addEventListener("mouseenter", () => {
    clearInterval(autoSlide);
});

slider.addEventListener("mouseleave", () => {
    if (!lightbox.classList.contains("active")) {
        startAutoSlide();
    }
});

showSlide(0);
startAutoSlide();
</script>

</body>
</html>
